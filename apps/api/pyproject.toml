[project]
name = "bella-api"
version = "0.1.0"
description = "Bella API — personal AI companion backend"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    # web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "gunicorn>=23.0.0",
    "python-multipart>=0.0.12",
    # settings & validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    # database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",
    # cache / queue
    "redis[hiredis]>=5.2.0",
    "arq>=0.26.1",
    # auth
    "pyjwt[crypto]>=2.10.0",
    "argon2-cffi>=23.1.0",
    # http & observability
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "opentelemetry-instrumentation-redis>=0.49b0",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "anyio>=4.6.0",
    "respx>=0.21.1",
    "testcontainers[postgres,redis]>=4.8.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-redis>=4.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ── ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "DTZ",       # naive datetimes — everything here is timezone-aware
    "T20",       # no print()
    "SIM",       # simplify
    "RUF",
    "ASYNC",     # async correctness
    "S",         # bandit
]
ignore = [
    "S101",   # assert — used in tests
    "B008",   # function call in default arg — this is how FastAPI Depends works
]
# TCH (type-checking imports) is deliberately not enabled. Its premise is that annotations
# are never needed at runtime, which is false throughout this stack: FastAPI resolves them
# for dependency injection, SQLAlchemy for mapper configuration, and Pydantic for model
# building. Applying its fixes breaks all three at import time.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
"app/db/migrations/*" = ["E501", "N999"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-type-checking]
# SQLAlchemy and Pydantic resolve annotations at runtime, so moving these imports into a
# TYPE_CHECKING block would break mapper configuration and model building at import time.
runtime-evaluated-base-classes = [
    "app.db.base.Base",
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "sqlalchemy.orm.DeclarativeBase",
]
runtime-evaluated-decorators = ["pydantic.validate_call"]

# ── mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["app/db/migrations/versions/"]

[[tool.mypy.overrides]]
module = ["arq.*", "pgvector.*"]
ignore_missing_imports = true


# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires postgres and redis",
    "security: cross-tenant isolation assertions",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/db/migrations/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
